name: Tự Động Cập Nhật Danh Sách Kênh Ondia Mi Tivi

on:
  schedule:
    - cron: '0 1 * * *' # Chạy tự động vào lúc 1:00 AM UTC mỗi ngày
  workflow_dispatch:      # Nút bấm để bạn có thể kích hoạt chạy thủ công bất cứ lúc nào

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn về máy ảo
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install requests

      - name: Chạy kịch bản lọc kênh
        run: python filter_iptv.py

      - name: Lưu danh sách kênh mới lên GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist_clean.m3u
          git commit -m "Tự động cập nhật playlist mới" || exit 0
          git push